<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tesis de Doctorado en Proceso - CCA-UAS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <link rel="stylesheet" href="../../css/tablas.css">
</head>
<body>
  <site-header data-root="../../"></site-header>

  <main class="container my-4 page-content">

    <!-- =========================================================================
         BANNER DE TÍTULO PRINCIPAL (Encabezado azul institucional)
         - Puedes cambiar el título <h1> o el subtítulo <p> según la página.
         - Si prefieres solo un texto simple sin el recuadro azul, puedes reemplazar
           este bloque por: <h2 class="fw-bold mb-3">Tesis en Proceso DCA</h2>
    ========================================================================= -->
    <div class="page-title-banner mb-4">
      <h1 class="fw-bold">Tesis en Proceso (DCA)</h1>
      <p>Doctorado en Ciencias Agropecuarias - Colegio de Ciencias Agropecuarias UAS</p>
    </div>

    <div class="card card-filtros p-3 mb-4">
      <div class="row g-3 align-items-end">
        <div class="col-md-7">
          <label for="busquedaAlumnoDCA" class="form-label fw-semibold">Buscar por Alumno, Tema o Comité</label>
          <input type="text" id="busquedaAlumnoDCA" class="form-control" placeholder="Ej. 'Gutiérrez', 'tomate', 'Fusarium', 'Sánchez'...">
        </div>
        <div class="col-md-5">
          <label for="filtroCohorteDCA" class="form-label fw-semibold">Filtrar por Cohorte</label>
          <select id="filtroCohorteDCA" class="form-select">
            <option value="todos">Todas las Cohortes</option>
          </select>
        </div>
      </div>
    </div>

    <div class="table-wrap">
      <div class="table-responsive">
        <table id="tablaTesisDCA" class="table tabla-uas">
          <thead>
            <tr>
              <th style="width: 22%;">Alumno</th>
              <th style="width: 40%;">Tema de Tesis</th>
              <th style="width: 26%;">Comité Tutorial</th>
              <th style="width: 12%;">Cohorte</th>
            </tr>
          </thead>
          <tbody>
          </tbody>
        </table>
      </div>
      <div class="paginacion-wrap">
        <nav aria-label="Paginación Tesis DCA">
          <ul id="paginacionDCA" class="pagination justify-content-center mb-0"></ul>
        </nav>
      </div>
    </div>
  </main>

  <site-footer data-root="../../"></site-footer>

  <!-- Scripts -->
  <script src="../../js/site-header.js"></script>
  <script src="../../js/site-footer.js"></script>
  <script src="../../js/menu.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="../../js/tablas-tesis.js"></script>
  <script src="tesis-dca-proceso.js"></script>
</body>
</html>
