<!DOCTYPE html>
<html lang="es">

  <title>Tesis de Maestría en Proceso - CCA-UAS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

        <div class="col-md-6">
          <label for="filtroCohorteMCA" class="form-label fw-semibold">Cohorte</label>

            <option value="todos">Todos</option>
          </select>
        </div>
      </div>
    </div>

    <div class="table-wrap">

              <th>Tema</th>
              <th>Comité Tutorial</th>
              <th>Cohorte</th>

          </thead>
          <tbody>
          </tbody>
        </table>
      </div>
      <div class="paginacion-wrap">
        <nav aria-label="Paginación Tesis MCA">

        </nav>
      </div>
    </div>

  <script src="../../js/tablas-tesis.js"></script>

</html>
