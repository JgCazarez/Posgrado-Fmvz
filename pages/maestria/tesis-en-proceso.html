<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tesis de Maestría en Proceso - CCA-UAS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <link rel="stylesheet" href="../../css/tablas.css">
</head>
<body>
  <site-header data-root="../../"></site-header>

  <main class="container my-4">
    <h2 class="fw-bold mb-3">Tesis en Proceso MCA</h2>

    <div class="card card-filtros p-3 mb-3">
      <div class="row g-3 align-items-end">
        <div class="col-md-6">
          <label for="busquedaAlumnoMCA" class="form-label fw-semibold">Buscar por alumno</label>
          <input type="text" id="busquedaAlumnoMCA" class="form-control" placeholder="Ej. 'Valdez', 'García', 'Ana'">
        </div>
        <div class="col-md-6">
          <label for="filtroCohorteMCA" class="form-label fw-semibold">Cohorte</label>
          <select id="filtroCohorteMCA" class="form-select">
            <option value="todos">Todos</option>
          </select>
        </div>
      </div>
    </div>

    <div class="table-wrap">
      <div class="table-responsive">
        <table id="tablaTesisMCA" class="table tabla-uas">
          <thead>
            <tr>
              <th>Alumno</th>
              <th>Tema</th>
              <th>Comité Tutorial</th>
              <th>Cohorte</th>
            </tr>
          </thead>
          <tbody>
          </tbody>
        </table>
      </div>
      <div class="paginacion-wrap">
        <nav aria-label="Paginación Tesis MCA">
          <ul id="paginacionMCA" class="pagination justify-content-center mb-0"></ul>
        </nav>
      </div>
    </div>
  </main>

  <script src="../../js/site-header.js"></script>
  <script src="../../js/menu.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="../../js/tablas-tesis.js"></script>
  <script src="tesis-mca-proceso.js"></script>
</body>
</html>
