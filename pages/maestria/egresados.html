<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCA: Egresados - CCA-UAS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <link rel="stylesheet" href="../../css/tablas.css">
  <style>
    .page-content-simple {
      background: #ffffff;
      padding: 40px 45px;
      margin: 30px auto;
      border-radius: 4px;
      max-width: 1200px;
    }
    .page-content-simple h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: #000000;
      margin-bottom: 25px;
    }
    .page-content-simple p {
      font-size: 1rem;
      line-height: 1.75;
      color: #1e293b;
      margin-bottom: 18px;
    }
    @media (max-width: 768px) {
      .page-content-simple {
        padding: 20px 16px;
      }
    }
  </style>
</head>
<body>
  <site-header data-root="../../"></site-header>

  <main class="container">
    <div class="page-content-simple">
      <h1>Egresados: Maestría en Ciencias Agropecuarias</h1>

      <div class="card card-filtros p-3 mb-4">
        <div class="row g-3 align-items-end">
          <div class="col-md-7">
            <label for="busquedaEgresadoMCA" class="form-label fw-semibold">Buscar por Maestro Graduado, Tema o Comité</label>
            <input type="text" id="busquedaEgresadoMCA" class="form-control" placeholder="Ej. nombre del egresado, tema de tesis...">
          </div>
          <div class="col-md-5">
            <label for="filtroCohorteEgresadoMCA" class="form-label fw-semibold">Filtrar por Cohorte</label>
            <select id="filtroCohorteEgresadoMCA" class="form-select">
              <option value="todos">Todas las Cohortes</option>
            </select>
          </div>
        </div>
      </div>

      <div class="table-wrap">
        <div class="table-responsive">
          <table id="tablaEgresadosMCA" class="table tabla-uas tabla-egresados">
            <thead>
              <tr>
                <th class="text-center" style="width: 14%;">Generación</th>
                <th class="text-center" style="width: 24%;">Alumno</th>
                <th class="text-center" style="width: 28%;">Director de Tesis</th>
                <th class="text-center" style="width: 34%;">Nombre de la Tesis</th>
              </tr>
            </thead>
            <tbody>
            </tbody>
          </table>
        </div>
        <div class="paginacion-wrap">
          <nav aria-label="Paginación Egresados MCA">
            <ul id="paginacionEgresadosMCA" class="pagination justify-content-center mb-0"></ul>
          </nav>
        </div>
      </div>

    </div>
  </main>

  <site-footer data-root="../../"></site-footer>

  <!-- Scripts -->
  <script src="../../js/site-header.js"></script>
  <script src="../../js/site-footer.js"></script>
  <script src="../../js/menu.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="../../js/tablas-tesis.js"></script>
  <script src="egresados-mca.js"></script>
</body>
</html>
