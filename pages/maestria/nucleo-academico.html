<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCA: Docentes y Núcleo Académico Básico - CCA-UAS</title>
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <style>
    .page-content-simple {
      background: #ffffff;
      padding: 40px 45px;
      margin: 30px auto;
      border-radius: 4px;
      max-width: 1200px;
    }
    .page-content-simple h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: #000000;
      margin-bottom: 12px;
    }
    .nab-intro {
      font-size: 0.98rem;
      line-height: 1.7;
      color: #334155;
      margin-bottom: 24px;
    }
    @media (max-width: 768px) {
      .page-content-simple {
        padding: 20px 16px;
      }
    }
  </style>
</head>
<body>
  <site-header data-root="../../"></site-header>

  <main class="container">
    <div class="page-content-simple">
      <h1>Núcleo Académico Básico: Maestría en Ciencias Agropecuarias</h1>
      
      <p class="nab-intro">
        Profesores e Investigadores que integran el Núcleo Académico Básico (NAB) de la Maestría en Ciencias Agropecuarias, adscritos a las facultades de Medicina Veterinaria y Zootecnia, Agronomía y Ciencias del Mar de la UAS.
      </p>

      <!-- Buscador en tiempo real -->
      <div class="docente-search-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px;">
          <label for="searchDocente" style="font-weight: 700; color: var(--azul-oscuro); font-size: 0.95rem;">
            🔍 Buscar Investigador / Docente:
          </label>
          <span id="docenteCount" style="font-size: 0.85rem; color: var(--texto-mutado); font-weight: 600;"></span>
        </div>
        <input type="text" id="searchDocente" placeholder="Escribe el nombre del docente, correo, facultad o tema de investigación...">
      </div>

      <!-- Contenedor interactivo de tarjetas de docentes -->
      <div class="docentes-grid" id="docentesContainer"></div>

    </div>
  </main>

  <site-footer data-root="../../"></site-footer>

  <!-- Scripts -->
  <script src="../../js/site-header.js"></script>
  <script src="../../js/site-footer.js"></script>
  <script src="../../js/menu.js"></script>
  <script src="../../js/docentes-data.js"></script>
  <script src="../../js/docentes-render.js"></script>
</body>
</html>
