<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Prueba (Google Sheets) - CCA-UAS</title>
  <link rel="icon" type="image/png" href="../assets/Favicon/logoFmvz-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/tablas.css">
</head>

<body>
  <site-header data-root="../"></site-header>

  <main class="container">
    <div class="page-content-simple">
      <h1>Repositorio de Tesis</h1>

      <!-- Filtros de la Tabla -->
      <div class="card card-filtros p-3 mb-4">
        <div class="row g-3 align-items-end">
          <div class="col-md-7">
            <label for="busquedaAdmin" class="form-label fw-semibold">Buscar por Alumno, Tema o Comité</label>
            <input type="text" id="busquedaAdmin" class="form-control"
              placeholder="Ej. nombre del estudiante, tema de tesis, director...">
          </div>
          <div class="col-md-5">
            <label for="filtroCohorteAdmin" class="form-label fw-semibold">Filtrar por Cohorte</label>
            <select id="filtroCohorteAdmin" class="form-select">
              <option value="todos">Todas las Cohortes</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Tabla de Datos en Vivo -->
      <div class="table-wrap">
        <div class="table-responsive">
          <table id="tablaAdminSheets" class="table tabla-uas tabla-repositorio-dca">
            <thead>
              <tr>
                <th style="width: 22%;">Alumno</th>
                <th style="width: 36%;">Tema de Tesis</th>
                <th style="width: 24%;">Comité Tutoral</th>
                <th style="width: 10%;">Cohorte</th>
                <th style="width: 8%;">Documento</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="5" class="text-center py-4 text-muted">Pega el enlace de Google Sheets arriba y presiona
                  "Conectar y Cargar" para ver los datos en tiempo real.</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="paginacion-wrap d-flex justify-content-between align-items-center flex-wrap gap-2">
          <div id="infoConteoAdmin" class="small text-muted fw-semibold">Mostrando 0 registros</div>
          <nav aria-label="Paginación Google Sheets">
            <ul id="paginacionAdmin" class="pagination mb-0"></ul>
          </nav>
        </div>
      </div>

    </div>
  </main>

  <site-footer data-root="../"></site-footer>

  <!-- Scripts -->
  <script src="../js/site-header.js"></script>
  <script src="../js/site-footer.js"></script>
  <script src="../js/menu.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="wp-admin.js"></script>
</body>

</html>
