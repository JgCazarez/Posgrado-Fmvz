<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Colegio de Ciencias Agropecuarias UAS</title>

    <!-- Hojas de estilo -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <site-header data-root="./"></site-header>

    <!-- Contenido Principal -->
    <main class="container">

        <!-- Banner -->
        <section class="hero-banner">
            <img src="assets/banner-congreso.jpg" alt="Congreso Nacional" class="responsive-img">
        </section>

        <hr class="divider">

        <!-- Convocatorias -->
        <section class="convocatorias-section">
            <h2 class="title-spaced">C O N V O C A T O R I A S</h2>

            <div class="grid-2-col">
                <div class="card">
                    <img src="assets/convocatoria-doctorado.jpg" alt="Convocatoria Doctorado" class="responsive-img">
                    <p>CONVOCATORIA DOCTORADO</p>
                </div>
                <div class="card">
                    <img src="assets/convocatoria-maestria.jpg" alt="Convocatoria Maestría" class="responsive-img">
                    <p>CONVOCATORIA MAESTRIA</p>
                </div>
            </div>
        </section>

        <hr class="divider">

        <!-- Noticias -->
        <section class="noticias-section">
            <h2 class="title-spaced">NOTICIAS</h2>

            <div class="grid-2-col">
                <div class="card">
                    <img src="assets/noticia-congreso.jpg" alt="4o Congreso" class="responsive-img">
                    <p class="link-blue">4o. Congreso Nacional de Estudiantes de Posgrado en Ciencias Agropecuarias</p>
                </div>
                <div class="card">
                    <img src="assets/noticia-snp.jpg" alt="SNP" class="responsive-img">
                    <p class="link-blue">obtención de reconocimiento del SNP, en los porgramas de Doctorado y Maestría
                        en Ciencias Agropecuarias</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="js/site-header.js"></script>
    <script src="js/menu.js"></script>
</body>

</html>
